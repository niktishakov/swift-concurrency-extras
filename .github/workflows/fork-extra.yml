# Fork test only: Windows and Wasm, old (upstream 8a4260f) vs new.
name: Fork extra platforms

on:
  push:
    branches:
      - fork-ci-foundation-free
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Swift ${{ matrix.swift }}, ${{ matrix.code }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.3', '6.4.1']
        code: ['old', 'new']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.code == 'old' && '8a4260f7373493435bd21194585c95b72bfdd401' || github.sha }}
          fetch-depth: 0
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.swift }}-release
          swift-build: ${{ matrix.swift }}-RELEASE
      - name: Run tests
        run: swift test
      - name: Environment variable probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/envprobe/Sources/EnvProbe"
          root=$(cygpath -m "$(pwd)" 2>/dev/null || pwd)
          printf '%s\n' '// swift-tools-version: 6.0' 'import PackageDescription' 'let package = Package(name: "EnvProbe", dependencies: [.package(path: "ROOT")], targets: [.executableTarget(name: "EnvProbe", dependencies: [.product(name: "ConcurrencyExtras", package: "swift-concurrency-extras")])])' > "$RUNNER_TEMP/envprobe/Package.swift"
          sed -i.bak "s|ROOT|${root//\\//}|" "$RUNNER_TEMP/envprobe/Package.swift"
          printf '%s\n' 'import ConcurrencyExtras' 'print("megaYieldCount=\(_defaultMegaYieldCount)")' > "$RUNNER_TEMP/envprobe/Sources/EnvProbe/main.swift"
          cd "$RUNNER_TEMP/envprobe" && swift build
          bin=$(swift build --show-bin-path)/EnvProbe
          "$bin" | tee out-default.txt
          TASK_MEGA_YIELD_COUNT=7 "$bin" | tee out-7.txt
          grep -q 'megaYieldCount=20' out-default.txt && grep -q 'megaYieldCount=7' out-7.txt
      - name: Linked DLLs
        shell: bash
        run: |
          swift build -c release --product ConcurrencyExtras 2>/dev/null || true
          find .build -name '*.exe' -path '*debug*' | head -1 | xargs -r objdump -p | grep 'DLL Name' || true

  wasm:
    name: Wasm (Swift 6.4.1, ${{ matrix.code }})
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    strategy:
      fail-fast: false
      matrix:
        code: ['old', 'new']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.code == 'old' && '8a4260f7373493435bd21194585c95b72bfdd401' || github.sha }}
          fetch-depth: 0
      - name: Install Swift SDK for WebAssembly
        run: swift sdk install https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz --checksum 783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8
      - name: Build library
        run: swift build --swift-sdk swift-6.4.1-RELEASE_wasm --target ConcurrencyExtras
      - name: Build tests
        run: swift build --swift-sdk swift-6.4.1-RELEASE_wasm --build-tests -Xlinker -z -Xlinker stack-size=$((1024 * 1024))
      - name: Install wasmtime
        run: |
          apt-get update -qq && apt-get install -y -qq xz-utils curl >/dev/null
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz | tar -xJ
      - name: Run tests
        run: |
          find .build -name '*.xctest' -o -name '*-test-runner*' -o -name '*.wasm' | grep -v '/checkouts/' | head
          swift test --swift-sdk swift-6.4.1-RELEASE_wasm -Xlinker -z -Xlinker stack-size=$((1024 * 1024))

  musl:
    name: Static Linux / Musl (Swift 6.4.1, ${{ matrix.code }})
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    strategy:
      fail-fast: false
      matrix:
        code: ['old', 'new']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.code == 'old' && '8a4260f7373493435bd21194585c95b72bfdd401' || github.sha }}
          fetch-depth: 0
      - name: Install static Linux SDK
        run: swift sdk install https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
      - name: Build library
        run: swift build --swift-sdk x86_64-swift-linux-musl --target ConcurrencyExtras
      - name: Run a static probe (re-entrancy and 4 threads)
        run: |
          mkdir -p /tmp/probe/Sources/Probe
          cat > /tmp/probe/Package.swift <<'PKG'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
            name: "Probe",
            dependencies: [.package(path: "PKGDIR")],
            targets: [.executableTarget(name: "Probe", dependencies: [.product(name: "ConcurrencyExtras", package: "swift-concurrency-extras")])]
          )
          PKG
          sed -i "s|PKGDIR|$PWD|" /tmp/probe/Package.swift
          cat > /tmp/probe/Sources/Probe/main.swift <<'SRC'
          import ConcurrencyExtras
          let x = LockIsolated(0)
          x.setValue(x.value + 1)
          x.withValue { _ in _ = x.value }
          await withTaskGroup(of: Void.self) { group in
            for _ in 0..<4 {
              group.addTask { for _ in 0..<100_000 { x.withValue { $0 += 1 } } }
            }
          }
          precondition(x.value == 400_001, "got \(x.value)")
          print("probe ok: \(x.value)")
          SRC
          cd /tmp/probe && swift build --swift-sdk x86_64-swift-linux-musl
          bin=$(swift build --swift-sdk x86_64-swift-linux-musl --show-bin-path)/Probe
          "$bin"
          (readelf -d "$bin" | grep NEEDED) || echo "no NEEDED: static executable"

  linux-older:
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.code }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', '6.1', '6.2']
        code: ['old', 'new']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.code == 'old' && '8a4260f7373493435bd21194585c95b72bfdd401' || github.sha }}
          fetch-depth: 0
      - name: Run tests
        run: swift test
      - name: Environment variable probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/envprobe/Sources/EnvProbe"
          root=$(cygpath -m "$(pwd)" 2>/dev/null || pwd)
          printf '%s\n' '// swift-tools-version: 6.0' 'import PackageDescription' 'let package = Package(name: "EnvProbe", dependencies: [.package(path: "ROOT")], targets: [.executableTarget(name: "EnvProbe", dependencies: [.product(name: "ConcurrencyExtras", package: "swift-concurrency-extras")])])' > "$RUNNER_TEMP/envprobe/Package.swift"
          sed -i.bak "s|ROOT|${root//\\//}|" "$RUNNER_TEMP/envprobe/Package.swift"
          printf '%s\n' 'import ConcurrencyExtras' 'print("megaYieldCount=\(_defaultMegaYieldCount)")' > "$RUNNER_TEMP/envprobe/Sources/EnvProbe/main.swift"
          cd "$RUNNER_TEMP/envprobe" && swift build
          bin=$(swift build --show-bin-path)/EnvProbe
          "$bin" | tee out-default.txt
          TASK_MEGA_YIELD_COUNT=7 "$bin" | tee out-7.txt
          grep -q 'megaYieldCount=20' out-default.txt && grep -q 'megaYieldCount=7' out-7.txt
